<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiggleTube</title>

<style>
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
    h1 { color: #ff0000; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }

    .search-container { display: flex; gap: 10px; max-width: 600px; margin-bottom: 25px; }
    .search-input { flex: 1; padding: 12px; background: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: white; font-size: 14px; }
    .search-btn { padding: 12px 24px; background: #ff0000; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #1f1f1f; border-radius: 12px; overflow: hidden; padding: 12px; border: 1px solid #2d2d2d; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #ff0000; }

    .thumb-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    img { width: 100%; height: 100%; object-fit: cover; }

    h3 { font-size: 14px; margin: 12px 0 6px; line-height: 1.4; max-height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .meta { font-size: 12px; color: #aaa; margin-bottom: 12px; }
    .score-tag { background: rgba(255,0,0,0.15); color: #ff4444; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }

    .copy-btn { width: 100%; padding: 10px; background: #2d2d2d; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .copy-btn:hover { background: #ff0000; }
    /* Info Button */
#infoButton {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #ff0000;
  color: white;
  font-size: 20px;
  padding: 7px 8px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 1000;
  transition: background 0.2s;
}
#infoButton:hover {
  background: #cc0000;
}

/* Modal Background */
#infoModal {
  display: none; 
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 999;
}

/* Modal Content Box */
#infoContent {
  background: #1f1f1f;
  color: white;
  width: 90%;
  max-width: 500px;
  margin: 120px auto;
  padding: 25px;
  border-radius: 12px;
  position: relative;
  animation: fadeIn 0.3s ease;
}

/* Close Button */
#closeInfo {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
  color: #aaa;
}
#closeInfo:hover {
  color: white;
}

/* Fade-in animation */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* Keep everything aligned in one row */
.search-container {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap; /* prevents weird wrapping */
}

/* Refresh button styling */
#refreshBtn {
  padding: 12px 20px;
  background: #2d2d2d;
  color: white;
  border: 1px solid #ff0000;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
  font-weight: bold
}

#refreshBtn:hover {
  background: #ff0000;
  color: white;
  transform: translateY(-2px);
}

/* Refresh button styling */
#searchBtn {
  padding: 12px 20px;
  background: #2d2d2d;
  color: white;
  border: 1px solid #ff0000;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

#searchBtn:hover {
  background: #ff0000;
  color: white;
  transform: translateY(-2px);
}

</style>
</head>

<body>
<!-- Info Button -->
<div id="infoButton">ℹ️</div>

<!-- Popup Modal -->
<div id="infoModal">
  <div id="infoContent">
    <span id="closeInfo">&times;</span>
    <section>
      <h1>How To Use GiggleTube (for Snelson):</h1>
      <p>Browse or search for videos you want to see and click "Copy Link". Then go to an empty Canva presentation and paste in the video to watch it.</p>
    </section>
  </div>
</div>

<script>
  const infoButton = document.getElementById("infoButton");
  const infoModal = document.getElementById("infoModal");
  const closeInfo = document.getElementById("closeInfo");

  infoButton.onclick = () => {
    infoModal.style.display = "block";
  };

  closeInfo.onclick = () => {
    infoModal.style.display = "none";
  };

  window.onclick = (e) => {
    if (e.target === infoModal) {
      infoModal.style.display = "none";
    }
  };
</script>


<h1>GiggleTube</h1>
<div class="subtitle" id="status">Loading baseline recommendations...</div>

<div class="search-container">
    <input type="text" class="search-input" id="searchBar" placeholder="Search anything...">
    <button class="search-btn" id="searchBtn" onclick="executeLiveSearch()">Search</button>
    <button id="refreshBtn">Refresh Feed</button>
</div>



<div class="grid" id="videoGrid"></div>

<script>
const INV_BASE = "https://invidious.flokinet.to/api/v1";

// ⭐ Working copy link button
function copyVideoLink(id, btn) {
    const url = "https://youtube.com/watch?v=" + id;
    navigator.clipboard.writeText(url).then(() => {
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy Link", 1500);
    });
}



// ⭐ Category inference (simple)
function inferCategory(text) {
    const t = text.toLowerCase();
    if (t.includes("game") || t.includes("play")) return "gaming";
    if (t.includes("cook") || t.includes("food") || t.includes("chef")) return "cooking";
    if (t.includes("music") || t.includes("lofi") || t.includes("song")) return "music";
    if (t.includes("science") || t.includes("tech") || t.includes("how")) return "science";
    return "general";
}

// ⭐ Ranking function
function scoreVideo(video, query) {
    let score = 100;
    const title = video.title.toLowerCase();
    const q = query.toLowerCase();

    if (title.includes(q)) score += 150;
    if (video.category === "music" || video.category === "science") score += 60;
    if (video.lengthSeconds < 400) score -= 30;

    return score;
}

// ⭐ Baseline trending feed
async function loadBaselineFeed(isRefresh = false) {
    const grid = document.getElementById("videoGrid");
    const status = document.getElementById("status");

    grid.innerHTML = "<p>Loading...</p>";
    status.innerText = isRefresh ? "Refreshing feed..." : "Loading baseline recommendations...";

    try {
        const response = await fetch(`${INV_BASE}/trending`);
        const results = await response.json();

        // ⭐ Algorithmic scoring
        const processed = results
            .filter(v => v.type === "video")
            .map(v => {
                const category = inferCategory(v.title);

                // Build a dynamic score
                let score = 0;

                // Randomness (makes refresh different)
                score += Math.random() * 100;

                // Boost newer videos
                if (v.published) {
                    const ageDays = (Date.now() - new Date(v.published).getTime()) / 86400000;
                    score += Math.max(0, 50 - ageDays); // newer = higher score
                }

                // Boost mid‑view videos (not too popular, not too small)
                if (v.viewCount) {
                    if (v.viewCount < 50000) score += 40;
                    else if (v.viewCount < 500000) score += 20;
                    else score -= 20;
                }

                // Boost certain categories
                if (category === "music") score += 30;
                if (category === "science") score += 20;

                // Penalize very long videos
                if (v.lengthSeconds > 1800) score -= 40;

                return {
                    id: v.videoId,
                    title: v.title,
                    author: v.author,
                    thumbnail: v.videoThumbnails?.[0]?.url ||
                        `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,
                    lengthSeconds: v.lengthSeconds || 0,
                    category,
                    finalScore: score
                };
            })
            .sort((a, b) => b.finalScore - a.finalScore); // highest score first

        grid.innerHTML = "";
        status.innerText = isRefresh ? "Feed refreshed!" : "Trending videos right now";

        processed.forEach(video => {
            const card = document.createElement("div");
            card.className = "card";

            const minutes = Math.floor(video.lengthSeconds / 60);

            card.innerHTML = `
                <div class="thumb-container">
                    <img src="${video.thumbnail}">
                    <span style="position:absolute; bottom:5px; right:5px; background:#0008; padding:2px 5px; font-size:11px; border-radius:3px;">
                        ${minutes}m
                    </span>
                </div>

                <h3>${video.title}</h3>

                <div>
                    <div class="score-tag">Score: ${Math.round(video.finalScore)}</div>
                    <p class="meta">👤 ${video.author}<br>🏷️ ${video.category}</p>
                    <button class="copy-btn" onclick="copyVideoLink('${video.id}', this)">Copy Link</button>
                </div>
            `;

            grid.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        status.innerText = "Could not load recommendations.";
        grid.innerHTML = "<p>Try again later.</p>";
    }
}

function refreshFeed() {
    loadBaselineFeed(true); // pass true to indicate refresh mode
}

// ⭐ Live search feed
async function executeLiveSearch() {
    const query = document.getElementById("searchBar").value.trim();
    const grid = document.getElementById("videoGrid");
    const status = document.getElementById("status");

    if (!query) return;

    status.innerText = "Searching...";
    grid.innerHTML = "<p>Loading...</p>";

    try {
        const response = await fetch(`${INV_BASE}/search?q=${encodeURIComponent(query)}`);
        const results = await response.json();

        const processed = results
            .filter(v => v.type === "video")
            .map(v => {
                const category = inferCategory(v.title);
                return {
                    id: v.videoId,
                    title: v.title,
                    author: v.author,
                    thumbnail: v.videoThumbnails?.[0]?.url ||
                        `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,
                    lengthSeconds: v.lengthSeconds || 0,
                    category,
                    finalScore: scoreVideo({ title: v.title, category, lengthSeconds: v.lengthSeconds }, query)
                };
            })
            .sort((a, b) => b.finalScore - a.finalScore);

        grid.innerHTML = "";
        status.innerText = `Found ${processed.length} videos`;

        processed.forEach(video => {
            const card = document.createElement("div");
            card.className = "card";

            const minutes = Math.floor(video.lengthSeconds / 60);

            card.innerHTML = `
                <div class="thumb-container">
                    <img src="${video.thumbnail}">
                    <span style="position:absolute; bottom:5px; right:5px; background:#0008; padding:2px 5px; font-size:11px; border-radius:3px;">
                        ${minutes}m
                    </span>
                </div>

                <h3>${video.title}</h3>

                <div>
                    <div class="score-tag">Match Rating: ${video.finalScore} pts</div>
                    <p class="meta">👤 ${video.author}<br>🏷️ ${video.category}</p>
                    <button class="copy-btn" onclick="copyVideoLink('${video.id}', this)">Copy Link</button>
                </div>
            `;

            grid.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        status.innerText = "Search failed.";
        grid.innerHTML = "<p>Try again later.</p>";
    }
}

// ⭐ Load baseline feed on startup
window.addEventListener("DOMContentLoaded", loadBaselineFeed);
</script>

</body>
</html>
