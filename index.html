<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Multi-Topic Recommendation Engine</title>

<style>
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
    h1 { color: #ff0000; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }

    .search-container { display: flex; gap: 10px; max-width: 600px; margin-bottom: 25px; }
    .search-input { flex: 1; padding: 12px; background: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: white; font-size: 14px; }
    .search-btn { padding: 12px 24px; background: #ff0000; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #1f1f1f; border-radius: 12px; overflow: hidden; padding: 12px; border: 1px solid #2d2d2d; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #ff0000; }

    .thumb-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    img { width: 100%; height: 100%; object-fit: cover; }

    h3 { font-size: 14px; margin: 12px 0 6px; line-height: 1.4; max-height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .meta { font-size: 12px; color: #aaa; margin-bottom: 12px; }
    .score-tag { background: rgba(255,0,0,0.15); color: #ff4444; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }

    .copy-btn { width: 100%; padding: 10px; background: #2d2d2d; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .copy-btn:hover { background: #ff0000; }
</style>
</head>

<body>

<h1>🤖 Live Multi-Topic Recommendation Engine</h1>
<div class="subtitle" id="status">Type any phrase to stream live video data packets...</div>

<div class="search-container">
    <input type="text" class="search-input" id="searchBar" placeholder="Search anything (e.g., cooking masterclass, gaming tricks, lofi, science)...">
    <button class="search-btn" onclick="executeLiveSearch()">Search Live</button>
</div>

<div class="grid" id="videoGrid"></div>

<script>
const INV_INSTANCE = "https://invidious.tiekoetter.com/api/v1/search";

async function executeLiveSearch() {
    const query = document.getElementById("searchBar").value.trim();
    const grid = document.getElementById("videoGrid");
    const status = document.getElementById("status");

    if (!query) return;

    status.innerText = "Querying live open media networks...";
    grid.innerHTML = "<p>Loading...</p>";

    try {
        const url = `${INV_INSTANCE}?q=${encodeURIComponent(query)}`;

        // ⭐ CORS bypass
        const response = await fetch(
            "https://corsproxy.io/?" + encodeURIComponent(url)
        );

        const results = await response.json();

        const processed = results
            .filter(v => v.type === "video")
            .map(v => ({
                id: v.videoId,
                title: v.title,
                author: v.author,
                thumbnail: v.videoThumbnails?.[0]?.url ||
                    `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,
                lengthSeconds: v.lengthSeconds || 0,
                category: "general",
                finalScore: 100
            }));

        grid.innerHTML = "";
        status.innerText = `Loaded ${processed.length} videos`;

        processed.forEach(video => {
            const card = document.createElement("div");
            card.className = "card";

            const minutes = Math.floor(video.lengthSeconds / 60);

            card.innerHTML = `
                <div class="thumb-container">
                    <img src="${video.thumbnail}">
                    <span style="position:absolute; bottom:5px; right:5px; background:#0008; padding:2px 5px; font-size:11px; border-radius:3px;">
                        ${minutes}m
                    </span>
                </div>

                <h3>${video.title}</h3>

                <div>
                    <p class="meta">👤 ${video.author}</p>
                    <button class="copy-btn" onclick="copyVideoLink('${video.id}', this)">Copy Link</button>
                </div>
            `;

            grid.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        status.innerText = "Network error — try again.";
        grid.innerHTML = "<p>Try again later.</p>";
    }
}
</script>


</body>
</html>
