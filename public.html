<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Video Feed</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
        h1 { color: #ff0000; font-size: 24px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.2); }
        .search-box { margin-bottom: 25px; display: flex; gap: 10px; max-width: 600px; }
        input { padding: 12px; flex: 1; border-radius: 6px; border: 1px solid #3c3c3c; background: #121212; color: white; font-size: 14px; }
        input:focus { border-color: #ff0000; outline: none; }
        button { padding: 12px 24px; background: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #cc0000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .card { background: #1f1f1f; border-radius: 12px; overflow: hidden; padding: 12px; border: 1px solid #2d2d2d; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #444; }
        .thumb-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        img { width: 100%; height: 100%; object-fit: cover; }
        h3 { font-size: 14px; margin: 12px 0 6px; line-height: 1.4; max-height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .meta { font-size: 12px; color: #aaa; margin: 0 0 12px 0; }
        .watch-btn { display: block; text-align: center; padding: 8px; background: #2d2d2d; color: white; text-decoration: none; font-size: 13px; border-radius: 6px; font-weight: bold; }
        .watch-btn:hover { background: #ff0000; }
    </style>
</head>
<body>

    <h1>🔍 Open Video Discovery & Recommender</h1>
    <div class="search-box">
        <input type="text" id="query" placeholder="Enter a topic (e.g., coding, lofi, science)...">
        <button onclick="fetchAndRecommend()">Discover</button>
    </div>

    <div class="grid" id="videoGrid">
        <p style="color: #aaa;">Type a keyword above to generate your custom video feed...</p>
    </div>

    <script>
        // FORCED ENCRYPTED HTTPS: Essential for GitHub Pages and Custom Web Domains
        const API_BASE = "https://nerdvpn.de";

        async function fetchAndRecommend() {
            const query = document.getElementById('query').value;
            const grid = document.getElementById('videoGrid');
            if (!query) return;

            grid.innerHTML = "<p style='color: #aaa;'>Analyzing feeds and running recommendation scoring...</p>";

            try {
                // Fetch search raw data directly through the browser-approved proxy endpoint
                const url = `${API_BASE}/search?q=${encodeURIComponent(query)}&type=video`;
                console.log("Attempting fetch to:", url);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP network error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                grid.innerHTML = "";

                if (!data || data.length === 0) {
                    grid.innerHTML = "<p style='color: #ff4444;'>No data packets returned. Try a different search phrase.</p>";
                    return;
                }

                // --- CUSTOM SCORING ALGORITHM ---
                const recommendedVideos = data
                    .filter(item => item.type === 'video')
                    .map(video => {
                        let score = 0;
                        score += (video.viewCount || 0) / 10000;
                        if (video.lengthSeconds > 300) score += 50; 
                        if (video.lengthSeconds < 60) score -= 100;
                        return { ...video, recommendationScore: score };
                    })
                    .sort((a, b) => b.recommendationScore - a.recommendationScore);

                // Rendering loop
                recommendedVideos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const thumbnail = video.videoThumbnails && video.videoThumbnails.length > 0 
                        ? video.videoThumbnails[0].url 
                        : (video.videoThumbnails && video.videoThumbnails.url ? video.videoThumbnails.url : `https://youtube.com{video.videoId}/0.jpg`);

                    const formattedViews = video.viewCount ? Number(video.viewCount).toLocaleString() : 'N/A';

                    card.innerHTML = `
                        <div class="thumb-container">
                            <img src="${thumbnail}" alt="Thumbnail">
                        </div>
                        <h3>${video.title}</h3>
                        <p class="meta">👤 ${video.author}<br>👁️ ${formattedViews} views</p>
                        <a class="watch-btn" href="https://youtube.com{video.videoId}" target="_blank">Watch Video ↗</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                grid.innerHTML = `<p style='color: #ff4444;'>Error communicating with the Invidious API mesh.<br><span style="font-size:11px;color:#888;">Details: ${error.message}</span></p>`;
                console.error("Pipeline failure details:", error);
            }
        }

        // Initialize a clean default state presentation
        window.onload = () => {
            document.getElementById('query').value = "open source algorithms";
            fetchAndRecommend();
        };
    </script>
</body>
</html>
